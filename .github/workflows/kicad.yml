name: KiCad hardware checks

on:
  push:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/kicad.yml"
  pull_request:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/kicad.yml"

jobs:
  kicad:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4

      - name: Show KiCad version
        run: kicad-cli version

      - name: Validate local footprint library with KiCad
        run: |
          set -eu
          lib=hardware/kicad/m1-rf/POR10.pretty
          fp="$lib/SSOP-24_Si4735-D60_P0.635mm.kicad_mod"
          test -s "$fp"
          # fp upgrade validates a .pretty footprint library in place. Supplying
          # a single .kicad_mod file makes KiCad treat it as a library conversion
          # input and returns "Unable to convert library".
          kicad-cli fp upgrade "$lib"
          grep -q '0.635' "$fp"

      - name: Validate standard testpoint footprint and assignments
        run: |
          set -eu
          # The ERC gate alone does not resolve PCB footprint library IDs.
          fp=/usr/share/kicad/footprints/TestPoint.pretty/TestPoint_Pad_D1.5mm.kicad_mod
          test -s "$fp"
          grep -q '(pad "1"' "$fp"
          python3 - <<'PY'
          from pathlib import Path
          import re
          sch = Path("hardware/kicad/m1-rf/por10-m1-rf.kicad_sch").read_text()
          # KiCad stores symbol instances as '(symbol (lib_id ...)'.
          # Restrict matches to placed TestPoint instances, not the library cache.
          instances = re.findall(
              r'\\(symbol\\s+\\(lib_id "Connector:TestPoint"\\)([\\s\\S]*?)(?=\\n  \\(symbol\\s+\\(lib_id|\\n  \\(wire|\\n\\))',
              sch,
          )
          assert len(instances) == 15, f"Expected 15 testpoints, got {len(instances)}"
          for body in instances:
              assert '(property "Footprint" "TestPoint:TestPoint_Pad_D1.5mm"' in body, "Missing testpoint footprint"
          print("All 15 testpoint footprints assigned and standard pad exists")
          PY

      - name: Validate local symbol library presence
        run: |
          test -s hardware/kicad/m1-rf/POR10.kicad_sym
          grep -q 'Si4735-D60-SSOP24' hardware/kicad/m1-rf/POR10.kicad_sym
          grep -q 'POR10:SSOP-24_Si4735-D60_P0.635mm' hardware/kicad/m1-rf/POR10.kicad_sym

      - name: ERC
        if: ${{ hashFiles('hardware/kicad/m1-rf/por10-m1-rf.kicad_sch') != '' }}
        run: |
          mkdir -p build/kicad
          set +e
          kicad-cli sch erc --exit-code-violations --output build/kicad/erc.rpt hardware/kicad/m1-rf/por10-m1-rf.kicad_sch
          rc=$?
          set -e
          cat build/kicad/erc.rpt || true
          exit "$rc"

      - name: Export schematic PDF
        if: ${{ hashFiles('hardware/kicad/m1-rf/por10-m1-rf.kicad_sch') != '' }}
        run: |
          mkdir -p build/kicad
          kicad-cli sch export pdf --output build/kicad/por10-m1-rf.pdf hardware/kicad/m1-rf/por10-m1-rf.kicad_sch

      - name: PCB DRC
        if: ${{ hashFiles('hardware/kicad/m1-rf/por10-m1-rf.kicad_pcb') != '' }}
        run: |
          mkdir -p build/kicad
          kicad-cli pcb drc --exit-code-violations --output build/kicad/drc.rpt hardware/kicad/m1-rf/por10-m1-rf.kicad_pcb

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: por10-kicad-qualification
          path: build/kicad/
          if-no-files-found: ignore
